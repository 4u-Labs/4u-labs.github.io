<!DOCTYPE html>
<html lang="{% if page.lang == 'en' %}en{% else %}pt-BR{% endif %}"{% if page.lang %} data-page-lang="{{ page.lang }}" data-lang="{{ page.lang }}"{% endif %}{% if page.translation_pt %} data-url-pt="{{ page.translation_pt | relative_url }}" data-url-en="{{ page.translation_en | relative_url }}"{% endif %}>
  {% include head.html %}
  <body>
    <div class="site-wrapper">
      {% include header.html %}
      <main class="main-content">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
